# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# The release zip as a portable app: winget unzips it, and narval.exe finds
# config\, packages\ and assets\ next to itself, setting up
# %USERPROFILE%\.narval from them on its first start.
PackageIdentifier: ArthurBarraux.Narval
PackageVersion: "@VERSION@"
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: narval-v@VERSION@-windows-x64\narval.exe
    PortableCommandAlias: narval
Commands:
  - narval
ReleaseDate: "@DATE@"
Installers:
  - Architecture: x64
    InstallerUrl: https://git.giorgio-nas.fr/arthur/narval/releases/download/v@VERSION@/narval-v@VERSION@-windows-x64.zip
    InstallerSha256: "@SHA256_WINDOWS@"
ManifestType: installer
ManifestVersion: 1.9.0
