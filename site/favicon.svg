<svg xmlns="http://www.w3.org/2000/svg" viewBox="98 99 828 828">
  <!-- narval's icon (assets/icons/narval.svg), cropped to its square. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6699"/>
      <stop offset="1" stop-color="#132f55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="14" stdDeviation="10" flood-color="#06142a" flood-opacity="0.45"/>
    </filter>
    <path id="body" d="M480 316 C572 314 648 375 648 455 C648 495 632 518 612 537 C592 555 565 570 550 582 C536 594 530 606 530 622 C530 642 540 656 556 663 C570 669 585 669 598 668 L612 673 L622 698 C590 716 540 726 480 726 C370 726 282 640 282 530 C282 410 370 318 480 316 Z"/>
  </defs>
  <g transform="translate(100 100) scale(1.1492) translate(-153 -152)">
    <rect x="153" y="152" width="717" height="719" rx="128" fill="url(#sea)"/>
    <g filter="url(#shadow)">
      <!-- tail fluke -->
      <path d="M604 676 C586 660 578 630 586 605 C592 588 602 576 615 567 C624 588 640 615 652 640 C680 640 712 652 732 672 C722 686 700 698 670 704 C648 708 628 705 612 698 Z" fill="#3079a6"/>
      <!-- body, over a darker copy: its lower rim -->
      <use href="#body" transform="translate(0 9)" fill="#3480b4"/>
      <use href="#body" fill="#4192c5"/>
      <!-- belly, inside the curl -->
      <path d="M632 477 C600 494 560 496 525 500 C490 506 458 525 448 560 C436 600 440 650 470 685 C495 705 530 708 560 707 C585 705 600 695 608 680 C590 682 565 682 545 670 C526 658 518 640 518 620 C518 595 532 578 548 565 C580 540 615 512 632 477 Z" fill="#b7dcee"/>
      <!-- flipper -->
      <path d="M382 549 C364 575 362 610 376 630 C410 626 446 600 449 540" fill="none" stroke="#3983b0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- tusk, its rounded base on the head -->
      <path d="M573.4 372.8 L705 236.3 A9 9 0 0 1 719 247.7 L610.6 403.2 A24 24 0 0 1 573.4 372.8 Z" fill="#e4c47a"/>
      <!-- eye -->
      <circle cx="498" cy="440" r="16" fill="#17304a"/>
    </g>
  </g>
</svg>
