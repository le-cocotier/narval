ShortDescription: Terminal text editor configured in Lisp, with LSP and a debugger.
Description: |-
  Narval is a terminal text editor for Windows, Linux and macOS, written in C
  and configured in Lisp. It runs natively in Windows Terminal (no WSL) and
  has language servers (LSP), a debugger (DAP), a git client, a package
  manager, terminal panes and a daemon mode several windows connect to.
