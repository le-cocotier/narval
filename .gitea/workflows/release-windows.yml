# Release packages: the Windows zip (windows-package) and the Linux
# packages and source tarball (linux-packages, at the end).
#
#
# Pushing a tag that starts with "v" (git tag v3.3 && git push origin v3.3)
# cross-compiles narval.exe on Linux and publishes
#   narval-<tag>-windows-x64.zip
# on the repository's Releases page: narval.exe, install.ps1, the default
# config, the bundled packages and a README. Windows users unzip it and run
# install.ps1 — no compiler, Meson or git needed.
#
# Publishing needs a token allowed to create releases. The automatic
# GITEA_TOKEN is used; if your Gitea refuses it (HTTP 403), create a
# personal access token with the "write:repository" scope and save it as
# the Actions secret RELEASE_TOKEN (Settings > Actions > Secrets).
#
# The same zip also goes to the Generic package registry, at
#   <server>/api/packages/<owner>/generic/narval/<version>/narval-<tag>-windows-x64.zip
# where <version> is the tag without its "v" (v3.4 -> 3.4). If Gitea refuses
# the automatic token there (HTTP 401/403), create a personal access token
# with the "write:package" scope and save it as the Actions secret
# PACKAGE_TOKEN.

name: Release packages

on:
  push:
    tags:
      - 'v*'

jobs:
  windows-package:
    runs-on: giorgio-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 zip curl jq

      - name: Check the OS boundary
        run: tools/check_os_boundary.sh .

      - name: Build the zip
        run: |
          packaging/windows/build-zip.sh "${{ github.ref_name }}" dist
          echo "PKG=narval-${{ github.ref_name }}-windows-x64" >> "$GITHUB_ENV"

      - name: Publish the release
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Any failed API call stops the job with Gitea's answer, rather
          # than leaving a green run with nothing published.
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }

          # The release for this tag: reuse it (a re-run, or one created by
          # hand with notes), else create it.
          if RELEASE=$(api "$API/releases/tags/$TAG" 2>/dev/null); then
            ID=$(jq -er '.id' <<<"$RELEASE")
          else
            ID=$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: ("Narval " + $tag),
                   body: "Windows: download the zip below, unzip it and run install.ps1 (see README.txt inside)."}' \
                 | api -X POST -H "Content-Type: application/json" --data @- "$API/releases" \
                 | jq -er '.id')
          fi
          echo "Release id: $ID"

          # Replace an asset of the same name (a re-run on the same tag).
          OLD_IDS=$(api "$API/releases/$ID/assets" | jq -r --arg n "$PKG.zip" '.[] | select(.name == $n) | .id')
          for OLD in $OLD_IDS; do
            api -X DELETE "$API/releases/$ID/assets/$OLD"
          done

          api -X POST -F "attachment=@dist/$PKG.zip" "$API/releases/$ID/assets?name=$PKG.zip" \
            | jq -er '"Published: " + .browser_download_url'

      - name: Publish to Gitea Packages
        shell: bash
        env:
          TOKEN: ${{ secrets.PACKAGE_TOKEN || secrets.GITEA_TOKEN }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }

          VERSION="${TAG#v}"
          URL="$SERVER/api/packages/$OWNER/generic/narval/$VERSION/$PKG.zip"

          # Gitea refuses to overwrite a file (HTTP 409), so a re-run on the
          # same tag deletes the old one first.
          curl -sS -o /dev/null -X DELETE -H "Authorization: token $TOKEN" "$URL" || true
          api --upload-file "dist/$PKG.zip" "$URL"
          echo "Published: $URL"

          # Show the package on the repository's Packages tab. Already
          # linked (or an older Gitea) is fine.
          curl -sS -o /dev/null -X POST -H "Authorization: token $TOKEN" \
            "$SERVER/api/v1/packages/$OWNER/generic/narval/-/link/$REPO" || true

      - name: Keep the zip as a build artifact too
        uses: actions/upload-artifact@v3
        with:
          name: narval-windows-x64
          path: dist/*.zip

  # Linux packages and the source tarball, attached to the same release
  # once the Windows job has created it:
  #   narval-<version>.tar.gz          the source tarball
  #   narval_<version>_{amd64,arm64}.deb
  #   narval-<version>-1.{x86_64,aarch64}.rpm
  # Both architectures, whatever the runner is: the other one is
  # cross-compiled.
  # Attaching uses the same token as above (RELEASE_TOKEN, else GITEA_TOKEN).
  linux-packages:
    runs-on: giorgio-runner
    needs: windows-package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc rpm curl jq
          # The cross-compiler for the architecture the runner isn't.
          case "$(dpkg --print-architecture)" in
            arm64) sudo apt-get install -y gcc-x86-64-linux-gnu ;;
            *)     sudo apt-get install -y gcc-aarch64-linux-gnu ;;
          esac

      - name: Build the source tarball, .deb and .rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          packaging/source-tarball.sh "$VERSION" dist
          packaging/linux/build-packages.sh "$VERSION" dist amd64
          packaging/linux/build-packages.sh "$VERSION" dist arm64
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Attach them to the release
        shell: bash
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITEA_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: token $TOKEN" "$@"; }
          ID=$(api "$API/releases/tags/$TAG" | jq -er '.id')
          for FILE in dist/*.tar.gz dist/*.deb dist/*.rpm; do
            NAME=$(basename "$FILE")
            for OLD in $(api "$API/releases/$ID/assets" | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .id'); do
              api -X DELETE "$API/releases/$ID/assets/$OLD"
            done
            api -X POST -F "attachment=@$FILE" "$API/releases/$ID/assets?name=$NAME" \
              | jq -er '"Published: " + .browser_download_url'
          done
